<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT UI - Smart AI & Auto Image</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --bg-main: #343541;
            --bg-sidebar: #202123;
            --bg-msg-user: #343541;
            --bg-msg-ai: #444654;
            --text-main: #ececf1;
            --border-color: #4d4d4f;
            --input-bg: #40414f;
        }

        .light-theme {
            --bg-main: #ffffff;
            --bg-sidebar: #f7f7f8;
            --bg-msg-user: #ffffff;
            --bg-msg-ai: #f7f7f8;
            --text-main: #374151;
            --border-color: #e5e5e5;
            --input-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Söhne', 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        #sidebar {
            width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column;
            padding: 10px; border-right: 1px solid var(--border-color); transition: transform 0.3s ease;
        }

        .new-chat-btn {
            border: 1px solid var(--border-color); border-radius: 5px; padding: 12px;
            background: transparent; color: var(--text-main); text-align: left; cursor: pointer;
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; margin-bottom: 10px;
        }
        .new-chat-btn:hover { background-color: rgba(255,255,255,0.05); }

        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item {
            padding: 10px; border-radius: 5px; cursor: pointer; font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px;
        }
        .history-item:hover { background-color: rgba(255,255,255,0.05); }

        .theme-toggle {
            padding: 12px; border-top: 1px solid var(--border-color); cursor: pointer;
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
        }

        #main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .sidebar-toggle { cursor: pointer; font-size: 1.2rem; }

        #messages-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
        
        .message-row { padding: 24px 20%; display: flex; gap: 20px; border-bottom: 1px solid var(--border-color); }
        .message-row.user { background-color: var(--bg-msg-user); }
        .message-row.ai { background-color: var(--bg-msg-ai); }

        .avatar {
            width: 30px; height: 30px; border-radius: 2px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.8rem; flex-shrink: 0;
        }
        .user .avatar { background-color: #5436DA; color: white; }
        .ai .avatar { background-color: #10a37f; color: white; }

        .message-text { flex: 1; line-height: 1.6; font-size: 1rem; word-break: break-word; white-space: pre-wrap; }
        .message-text img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color); display: block; }

        .copy-btn {
            background: transparent; border: none; color: #8e8ea0; cursor: pointer;
            font-size: 0.8rem; margin-top: 10px; display: flex; align-items: center; gap: 5px;
        }
        .copy-btn:hover { color: var(--text-main); }

        #input-area { padding: 20px 20%; background-color: var(--bg-main); }
        .input-box {
            background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        textarea {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            outline: none; font-size: 1rem; resize: none; height: 24px; max-height: 200px;
        }
        .send-btn { background: #10a37f; color: white; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; z-index: 10; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            .message-row, #input-area { padding-left: 15px; padding-right: 15px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> New chat
        </button>
        <div id="history-list"></div>
        <div class="theme-toggle" onclick="toggleTheme()">
            <i class="fa-solid fa-sun" id="theme-icon"></i> <span id="theme-text">Light mode</span>
        </div>
    </div>

    <div id="main-chat">
        <header>
            <i class="fa-solid fa-bars sidebar-toggle" onclick="toggleSidebar()"></i>
            <span>AI Smart Instant Image</span>
            <div></div>
        </header>

        <div id="messages-container">
            <div class="message-row ai">
                <div class="avatar">AI</div>
                <div class="message-text">Salut! Zi-mi ce vrei să afli sau spune-mi simplu <b>"creează o poză cu o mașină mustang"</b> și o generez direct, fără alte întrebări!</div>
            </div>
        </div>

        <div id="input-area">
            <div class="input-box">
                <textarea id="user-input" placeholder="Scrie aici mesajul..." rows="1" onkeypress="handleKeyPress(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('messages-container');
        const userInput = document.getElementById('user-input');
        const historyList = document.getElementById('history-list');

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if(document.body.classList.contains('light-theme')) {
                icon.className = "fa-solid fa-moon"; text.textContent = "Dark mode";
            } else {
                icon.className = "fa-solid fa-sun"; text.textContent = "Light mode";
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(role, content) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'U' : 'AI';

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.innerHTML = content;

            row.appendChild(avatar);
            row.appendChild(textDiv);

            if(role === 'ai') {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(textDiv.innerText.replace('Copy', '').trim());
                    copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                    setTimeout(() => copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`, 2000);
                };
                textDiv.appendChild(copyBtn);
            }

            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
            return textDiv;
        }

        // Verifică dacă mesajul cere o imagine (fără să fie nevoie de /imagine)
        function isImageRequest(text) {
            const lower = text.toLowerCase();
            const keywords = ['imagine', 'poza', 'creeaza', 'creează', 'deseneaza', 'desenează', 'fă o poză', 'fa o poza', 'genereaza', 'generează', '/imagine'];
            return keywords.some(kw => lower.includes(kw));
        }

        function generateImage(prompt, aiBox) {
            // Curățăm prompt-ul de cuvinte de umplutură
            let cleanPrompt = prompt.toLowerCase()
                .replace(/creeaza|creează|genereaza|generează|fa|fă|o|poza|poză|imagine|cu|deseneaza|desenează|\/imagine/g, '')
                .trim();

            if (!cleanPrompt) cleanPrompt = prompt;

            // Adăugăm automat fundal, detalii, lumini și aspect fotorealist
            const enhancedPrompt = `${cleanPrompt}, stunning photorealistic, ford mustang muscle car, dramatic lighting, high detail, 8k resolution, cinematic atmosphere`;
            const seed = Math.floor(Math.random() * 1000000);
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=1024&height=1024&model=flux&nologo=true&seed=${seed}`;

            aiBox.innerHTML = `Am generat poza direct:<br><img src="${imgUrl}" alt="${cleanPrompt}">`;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addHistoryItem(text);
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            const aiBox = appendMessage('ai', 'Se procesează...');

            // Dacă utilizatorul cere o poză/imagine, o generăm pe loc
            if (isImageRequest(text)) {
                generateImage(text, aiBox);
                return;
            }

            // Chat Text obișnuit cu instrucțiune să nu mai pună întrebări inutile
            try {
                const systemPrompt = "Răspunde scurt, la obiect și direct. Nu pune întrebări inutile înapoi.";
                const response = await puter.ai.chat(`${systemPrompt}\nUtilizator: ${text}`);
                const fullText = typeof response === 'object' ? response.toString() : response;
                typeWriterEffect(aiBox, fullText);
            } catch (err) {
                aiBox.textContent = "A apărut o eroare de rețea. Te rog reîncearcă!";
            }
        }

        function typeWriterEffect(element, text) {
            element.innerHTML = "";
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    container.scrollTop = container.scrollHeight;
                } else {
                    clearInterval(timer);
                }
            }, 2);
        }

        function addHistoryItem(text) {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<i class="fa-regular fa-message"></i> ${text}`;
            historyList.prepend(item);
        }

        function startNewChat() {
            container.innerHTML = `
                <div class="message-row ai">
                    <div class="avatar">AI</div>
                    <div class="message-text">Chat nou! Cu ce te ajut acum?</div>
                </div>
            `;
        }
    </script>
</body>
</html>
