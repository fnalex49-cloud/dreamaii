<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Dice</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 70% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 85% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(circle at 50% 0%, #1a1f3a, #05060f 70%);
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 50px;
  }

  .logo-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    padding: 8px 20px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.03);
  }
  .logo-bar .cube { font-size: 1.2rem; }
  .logo-bar .name {
    font-weight: 800;
    letter-spacing: 1px;
    font-size: 1rem;
    background: linear-gradient(90deg,#ff5e5e,#ffb347,#ffe45e,#6effa1,#5ec8ff,#c07bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .counter {
    font-size: 1.5rem;
    font-weight: 700;
    color: #e8ecff;
    margin: 10px 0 2px;
  }

  .tagline {
    color: #9aa3c7;
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .possible-title {
    font-size: 0.7rem;
    color: #8a92b8;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .pill-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 26px;
  }
  .pill {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #05060f;
  }

  .dice-row {
    display: flex;
    gap: 14px;
    margin: 6px 0 26px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .die {
    width: 78px;
    height: 78px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 22px 2px var(--glow, #333);
    border: 2px solid rgba(255,255,255,0.5);
    background: #111;
    transition: transform .15s ease;
  }
  .die.rolling { animation: spin 0.08s linear infinite; }
  @keyframes spin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(12deg) scale(1.04); }
    100% { transform: rotate(-12deg) scale(0.96); }
  }
  .die .dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
  }

  .id-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #f4d94a;
    color: #1a1a1a;
    font-weight: 700;
    font-size: 0.75rem;
    border-radius: 8px;
    padding: 8px 18px;
    margin-bottom: 14px;
  }
  .id-bar .verify {
    border-left: 1px solid rgba(0,0,0,0.3);
    padding-left: 10px;
    letter-spacing: 1px;
  }

  button#rollBtn {
    background: linear-gradient(90deg,#4fc8ff,#7ee2ff);
    border: none;
    color: #012;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 14px 60px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(79,200,255,0.6);
    transition: transform .1s ease;
    text-transform: uppercase;
  }
  button#rollBtn:active { transform: scale(0.96); }
  button#rollBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .panel {
    margin-top: 30px;
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .panel h2 {
    font-size: 0.72rem;
    color: #cfd6ff;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .color-toggle-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .color-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.03);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    user-select: none;
  }
  .color-toggle input { accent-color: #4fc8ff; width: 16px; height: 16px; cursor: pointer; }
  .swatch {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
  }
  .color-toggle.excluded { opacity: 0.4; text-decoration: line-through; }
  .color-toggle span.label { font-size: 0.82rem; }

  .history-block { margin-top: 18px; }
  .history-scroll {
    max-height: 100px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .history-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.68rem;
    color: #9aa3c7;
  }
  .history-row .mini {
    width: 14px; height: 14px; border-radius: 4px;
  }

  .fade-hide {
    opacity: 0 !important;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .logo-bar, .tagline, .possible-title, .pill-row, #rollBtn, .panel {
    transition: opacity 0.2s ease;
  }
  body.rolling-bg {
    background: #fff !important;
    transition: background 0.15s ease;
  }
  body { transition: background 0.3s ease; }
</style>
</head>
<body>

<div class="logo-bar">
  <span class="cube">🎲</span>
  <span class="name">COSMIC-DICE</span>
</div>

<div class="tagline">4 Colored Dice · Secure Random Rolls</div>

<div class="possible-title">Possible Colors</div>
<div class="pill-row" id="pillRow"></div>

<div class="dice-row" id="diceRow"></div>

<button id="rollBtn">Roll</button>

<div class="panel">
  <div class="panel-header">
    <h2>Active Colors</h2>
  </div>
  <div class="color-toggle-list" id="colorList"></div>

  <div class="history-block">
    <h2>Last 50 Results</h2>
    <div class="history-scroll" id="historyList"></div>
  </div>
</div>

<script>
const COLORS = [
  { key: 'red',    label: 'Red',    hex: '#ff5555' },
  { key: 'orange', label: 'Orange', hex: '#ffa447' },
  { key: 'yellow', label: 'Yellow', hex: '#ffe45e' },
  { key: 'green',  label: 'Green',  hex: '#5eff9c' },
  { key: 'blue',   label: 'Blue',   hex: '#5ec8ff' },
  { key: 'purple', label: 'Purple', hex: '#c07bff' },
];

let enabled = {};
COLORS.forEach(c => enabled[c.key] = true);
let history = [];

const diceRow = document.getElementById('diceRow');
const colorList = document.getElementById('colorList');
const historyList = document.getElementById('historyList');
const pillRow = document.getElementById('pillRow');
const rollBtn = document.getElementById('rollBtn');

function renderPills() {
  pillRow.innerHTML = '';
  COLORS.forEach(c => {
    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.style.background = c.hex;
    pill.textContent = c.label;
    pillRow.appendChild(pill);
  });
}

function renderColorList() {
  colorList.innerHTML = '';
  COLORS.forEach(c => {
    const row = document.createElement('label');
    row.className = 'color-toggle' + (enabled[c.key] ? '' : ' excluded');
    row.innerHTML = `
      <input type="checkbox" ${enabled[c.key] ? 'checked' : ''} data-key="${c.key}">
      <span class="swatch" style="background:${c.hex}"></span>
      <span class="label">${c.label}</span>
    `;
    colorList.appendChild(row);
  });

  colorList.querySelectorAll('input').forEach(input => {
    input.addEventListener('change', e => {
      const key = e.target.dataset.key;
      const activeCount = Object.values(enabled).filter(Boolean).length;
      if (!e.target.checked && activeCount <= 1) {
        e.target.checked = true;
        return;
      }
      enabled[key] = e.target.checked;
      renderColorList();
      renderPills();
    });
  });
}

function initDice() {
  diceRow.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const die = document.createElement('div');
    die.className = 'die';
    die.style.setProperty('--glow', '#333');
    die.innerHTML = '<div class="dot" style="background:#444"></div>';
    diceRow.appendChild(die);
  }
}

function randomActiveColor() {
  const active = COLORS.filter(c => enabled[c.key]);
  return active[Math.floor(Math.random() * active.length)];
}

function addHistory(results) {
  history.unshift(results);
  if (history.length > 50) history.pop();
  renderHistory();
}

function renderHistory() {
  historyList.innerHTML = '';
  if (history.length === 0) {
    historyList.innerHTML = '<div class="history-row">No results yet</div>';
    return;
  }
  history.forEach(res => {
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = res.map(c => `<span class="mini" style="background:${c.hex}"></span>`).join('');
    historyList.appendChild(row);
  });
}

function roll() {
  rollBtn.disabled = true;
  document.body.classList.add('rolling-bg');
  document.querySelectorAll('.logo-bar, .tagline, .possible-title, .pill-row, .panel')
    .forEach(el => el.classList.add('fade-hide'));
  rollBtn.classList.add('fade-hide');
  const dice = diceRow.querySelectorAll('.die');

  dice.forEach(d => {
    d.classList.add('rolling');
    d.style.setProperty('--glow', '#fff');
    d.style.background = '#1a1a1a';
    d.style.borderColor = '#fff';
    d.querySelector('.dot').style.background = '#fff';
  });

  let ticks = 0;
  const maxTicks = 12;
  const interval = setInterval(() => {
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(interval);
      const finalResults = [];
      dice.forEach(d => {
        const c = randomActiveColor();
        finalResults.push(c);
        d.classList.remove('rolling');
        d.style.setProperty('--glow', c.hex);
        d.style.background = c.hex + '33';
        d.style.borderColor = c.hex;
        d.querySelector('.dot').style.background = '#fff';
        d.title = c.label;
      });
      addHistory(finalResults);
      rollBtn.disabled = false;
      document.body.classList.remove('rolling-bg');
      document.querySelectorAll('.logo-bar, .tagline, .possible-title, .pill-row, .panel')
        .forEach(el => el.classList.remove('fade-hide'));
      rollBtn.classList.remove('fade-hide');
    }
  }, 70);
}

initDice();
renderPills();
renderColorList();
renderHistory();
rollBtn.addEventListener('click', roll);
</script>

</body>
</html>
