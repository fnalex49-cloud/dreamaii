<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #343541;
            --bg-sidebar: #202123;
            --bg-msg-user: #343541;
            --bg-msg-ai: #444654;
            --text-main: #ececf1;
            --border-color: #4d4d4f;
            --input-bg: #40414f;
        }

        .light-theme {
            --bg-main: #ffffff;
            --bg-sidebar: #f7f7f8;
            --bg-msg-user: #ffffff;
            --bg-msg-ai: #f7f7f8;
            --text-main: #374151;
            --border-color: #e5e5e5;
            --input-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Söhne', 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        #sidebar {
            width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column;
            padding: 10px; border-right: 1px solid var(--border-color); transition: transform 0.3s ease;
        }

        .new-chat-btn {
            border: 1px solid var(--border-color); border-radius: 5px; padding: 12px;
            background: transparent; color: var(--text-main); text-align: left; cursor: pointer;
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; margin-bottom: 10px;
        }

        .new-chat-btn:hover { background-color: rgba(255,255,255,0.05); }

        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .history-item {
            padding: 10px; border-radius: 5px; cursor: pointer; font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px;
        }
        .history-item:hover { background-color: rgba(255,255,255,0.05); }

        .theme-toggle {
            padding: 12px; border-top: 1px solid var(--border-color); cursor: pointer;
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
        }

        /* Main Chat Area */
        #main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .sidebar-toggle { cursor: pointer; font-size: 1.2rem; }

        #messages-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        
        .message-row {
            padding: 24px 20%; display: flex; gap: 20px; border-bottom: 1px solid var(--border-color);
        }
        .message-row.user { background-color: var(--bg-msg-user); }
        .message-row.ai { background-color: var(--bg-msg-ai); }

        .avatar {
            width: 30px; height: 30px; border-radius: 2px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.8rem; flex-shrink: 0;
        }
        .user .avatar { background-color: #5436DA; color: white; }
        .ai .avatar { background-color: #10a37f; color: white; }

        .message-text { flex: 1; line-height: 1.6; font-size: 1rem; word-break: break-word; }
        .message-text img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color); display: block; }

        .copy-btn {
            background: transparent; border: none; color: #8e8ea0; cursor: pointer;
            font-size: 0.8rem; margin-top: 10px; display: flex; align-items: center; gap: 5px;
        }
        .copy-btn:hover { color: var(--text-main); }

        /* Input Container */
        #input-area { padding: 20px 20%; background-color: var(--bg-main); }
        .input-box {
            background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        textarea {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            outline: none; font-size: 1rem; resize: none; height: 24px; max-height: 200px;
        }
        .send-btn { background: #10a37f; color: white; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; z-index: 10; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            .message-row, #input-area { padding-left: 15px; padding-right: 15px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> New chat
        </button>
        <div id="history-list"></div>
        <div class="theme-toggle" onclick="toggleTheme()">
            <i class="fa-solid fa-sun" id="theme-icon"></i> <span id="theme-text">Light mode</span>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div id="main-chat">
        <header>
            <i class="fa-solid fa-bars sidebar-toggle" onclick="toggleSidebar()"></i>
            <span>ChatGPT 3.5 Turbo</span>
            <div></div>
        </header>

        <div id="messages-container">
            <div class="message-row ai">
                <div class="avatar">AI</div>
                <div class="message-text">Salut! Sunt pregătit. Îmi poți pune orice întrebare, iar dacă dorești o imagine, folosește <b>/imagine</b> urmat de descriere!</div>
            </div>
        </div>

        <div id="input-area">
            <div class="input-box">
                <textarea id="user-input" placeholder="Trimite un mesaj..." rows="1" onkeypress="handleKeyPress(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('messages-container');
        const userInput = document.getElementById('user-input');
        const historyList = document.getElementById('history-list');

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if(document.body.classList.contains('light-theme')) {
                icon.className = "fa-solid fa-moon";
                text.textContent = "Dark mode";
            } else {
                icon.className = "fa-solid fa-sun";
                text.textContent = "Light mode";
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(role, content) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'U' : 'AI';

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.innerHTML = content;

            row.appendChild(avatar);
            row.appendChild(textDiv);

            if(role === 'ai') {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`;
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(textDiv.innerText.replace('Copy', '').trim());
                    copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                    setTimeout(() => copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`, 2000);
                };
                textDiv.appendChild(copyBtn);
            }

            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
            return textDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addHistoryItem(text);
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Comandă /imagine
            if (text.toLowerCase().startsWith('/imagine')) {
                const prompt = text.replace(/\/imagine/i, '').trim();
                const aiBox = appendMessage('ai', 'Generăm imaginea...');
                const seed = Math.floor(Math.random() * 1000000);
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
                aiBox.innerHTML = `Iată imaginea ta pentru <i>"${prompt}"</i>:<br><img src="${imgUrl}">`;
                return;
            }

            const aiBox = appendMessage('ai', 'Se gândește...');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();

                if (data.error) {
                    aiBox.textContent = "Eroare: " + (data.error.message || data.error);
                } else {
                    const fullText = data.candidates[0].content.parts[0].text;
                    typeWriterEffect(aiBox, fullText);
                }
            } catch (err) {
                aiBox.textContent = "Eroare de conexiune la server.";
            }
        }

        function typeWriterEffect(element, text) {
            element.innerHTML = "";
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                    i++;
                    container.scrollTop = container.scrollHeight;
                } else {
                    clearInterval(timer);
                }
            }, 8);
        }

        function addHistoryItem(text) {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<i class="fa-regular fa-message"></i> ${text}`;
            historyList.prepend(item);
        }

        function startNewChat() {
            container.innerHTML = `
                <div class="message-row ai">
                    <div class="avatar">AI</div>
                    <div class="message-text">Chat nou inițializat! Cu ce te pot ajuta?</div>
                </div>
            `;
        }
    </script>
</body>
</html>
