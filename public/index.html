<script>
    // Pune cheia ta gratuită direct între ghilimele mai jos:
    const GEMINI_API_KEY = "AQ.Ab8RN6LJ9OjBveyrOXDQKpR4XIajQO8eGYNFauyPyhS1FwQ9AQ";

    const container = document.getElementById('messages-container');
    const userInput = document.getElementById('user-input');

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        // Comandă /imagine
        if (text.toLowerCase().startsWith('/imagine')) {
            const prompt = text.replace(/\/imagine/i, '').trim();
            const aiBox = appendMessage('ai', 'Generăm imaginea...');
            const seed = Math.floor(Math.random() * 1000000);
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
            aiBox.innerHTML = `Iată imaginea ta: <br><img src="${imgUrl}">`;
            return;
        }

        // Chat Text direct prin Google Gemini API
        const aiBox = appendMessage('ai', 'Se gândește...');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();

            if (data.error) {
                aiBox.textContent = "Eroare Gemini: " + data.error.message;
            } else {
                const reply = data.candidates[0].content.parts[0].text;
                aiBox.textContent = reply;
            }
        } catch (err) {
            aiBox.textContent = "Eroare la conexiunea cu Google Gemini API.";
        }
    }

    function appendMessage(role, content) {
        const row = document.createElement('div');
        row.className = `message-row ${role}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'U' : 'AI';

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        textDiv.innerHTML = content;

        row.appendChild(avatar);
        row.appendChild(textDiv);
        container.appendChild(row);
        container.scrollTop = container.scrollHeight;
        return textDiv;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }
</script>
